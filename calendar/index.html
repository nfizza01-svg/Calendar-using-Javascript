<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leap Year Calendar</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="background-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <div class="container d-flex align-items-center justify-content-center min-vh-100">
        <div class="glass-card p-5 text-center">
            <h1 class="mb-2 fw-bold text-white">Leap Year Checker</h1>
            <p class="text-white-50 mb-4">Enter a year to verify and see the calendar.</p>

            <div class="input-group mb-4 search-group">
                <input type="number" id="yearInput" class="form-control form-control-lg" placeholder="Enter Year (e.g. 2024)" aria-label="Enter Year">
                <button class="btn btn-primary btn-lg" type="button" id="checkBtn">
                    <i class="fas fa-search me-2"></i>Check
                </button>
            </div>

            <div id="resultContainer" class="result-container d-none">
                <div id="resultIcon" class="mb-3"></div>
                <h2 id="resultText" class="fw-bold mb-1"></h2>
                <p id="resultSubtext" class="text-white-50 mb-4"></p>
                
                <div class="calendar-preview mt-4">
                    <h5 class="text-white mb-3">February <span id="displayYear"></span></h5>
                    <div class="calendar-grid" id="calendarGrid">
                        <!-- Calendar days will be generated here -->
                    </div>
                </div>
            </div>
            
            <div id="welcomeState" class="welcome-state">
                <i class="fas fa-calendar-alt fa-4x text-white-50 mb-3"></i>
                <p class="text-white-50">Go ahead, try a number!</p>
            </div>

        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="script.js"></script>
</body>
</html>
